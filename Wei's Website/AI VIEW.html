<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI_VIEW: ENHANCED_VISUAL_STREAM</title>
    <!-- Include ml5.js for facial recognition -->
    <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
    <!-- Include Markdown parser for rendering output -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background-color: #000; 
            font-family: 'Courier New', Courier, monospace;
            cursor: default; 
        }
        
        /* Alert overlay: Halo feedback only, no text */
        #alert-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 5;
            transition: box-shadow 0.3s;
            box-shadow: inset 0 0 100px rgba(255, 0, 0, 0);
        }

        /* Native video feed window */
        #native-view {
            position: absolute;
            bottom: 30px;
            right: 30px; /* Moved to bottom right to avoid blocking HUD */
            width: 220px;
            height: 165px;
            border: 1px solid rgba(0, 255, 255, 0.5);
            border-radius: 4px;
            overflow: hidden;
            z-index: 20;
            box-shadow: 0 0 20px rgba(0, 0, 0, 1), 0 0 10px rgba(0, 255, 255, 0.2);
            transform: scaleX(-1); /* Mirror effect */
        }

        #native-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(1.1) brightness(0.9);
        }

        /* Global effect during hostile state */
        .hostile #alert-overlay {
            box-shadow: inset 0 0 150px rgba(255, 0, 0, 0.7);
        }
        .hostile #native-view {
            border-color: rgba(255, 0, 0, 0.8);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
        }

        /* --- Added: HUD & Control Panel UI --- */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .hud-text {
            color: #0ff; 
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
            margin-bottom: 5px;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.5);
            padding: 2px 5px;
            display: inline-block;
        }
        
        #controls {
            pointer-events: auto;
            margin-top: 10px;
            background: rgba(0, 20, 40, 0.85);
            padding: 10px;
            border: 1px solid #0ff;
            border-radius: 4px;
            max-width: 300px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
            max-height: 80vh;
            overflow-y: auto;
            backdrop-filter: blur(5px);
        }
        
        label {
            color: #0ff;
            font-size: 12px;
            display: block;
            margin-top: 5px;
            font-weight: bold;
        }
        
        select, input[type=range] {
            background: #000;
            color: #0ff;
            border: 1px solid #0ff;
            font-family: 'Courier New', Courier, monospace;
            padding: 3px;
            width: 100%;
            margin-bottom: 5px;
            cursor: pointer;
        }

        button {
            background: #000;
            color: #0ff;
            border: 1px solid #0ff;
            padding: 8px;
            margin-top: 5px;
            width: 100%;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 11px;
        }
        
        button:hover {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 10px #0ff;
        }

        #fullscreenBtn { border-color: #ff00ff; color: #ff00ff; }
        #fullscreenBtn:hover { background: #ff00ff; color: #000; box-shadow: 0 0 10px #ff00ff; }

        #xrBtn { border-color: #ffff00; color: #ffff00; }
        #xrBtn:hover { background: #ffff00; color: #000; box-shadow: 0 0 10px #ffff00; }
        
        button:disabled {
            border-color: #555;
            color: #555;
            cursor: not-allowed;
            box-shadow: none;
            opacity: 0.6;
        }

        .identity-locked {
            color: #fff;
            background: rgba(0, 100, 255, 0.6);
            border: 1px solid cyan;
            font-weight: bold;
            display: none;
            text-align: center;
            font-size: 16px;
            padding: 5px 20px;
            margin-top: 10px;
            backdrop-filter: blur(4px);
        }

        #analysis-log {
            pointer-events: auto;
            position: absolute;
            top: 20px;
            right: 20px;
            width: 320px;
            max-height: 80vh;
            overflow-y: auto;
            background: rgba(0, 10, 20, 0.95);
            border: 1px solid #0ff;
            padding: 15px;
            color: #0ff;
            font-size: 12px;
            display: none; 
            box-shadow: -5px 5px 20px rgba(0,0,0,0.5);
        }
        
        #analysis-log h3 {
            margin-top: 0;
            border-bottom: 1px solid #0ff;
            padding-bottom: 5px;
            letter-spacing: 1px;
        }
        
        .loading-pulse { animation: pulse 1s infinite; }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
    </style>
</head>
<body>

    <!-- Three.js background layer will be appended here -->

    <!-- Global filter and alert layer -->
    <div id="alert-overlay"></div>

    <!-- UI HUD Layer -->
    <div id="hud">
        <div class="hud-top">
            <div class="hud-text">SYSTEM: <span>NAV_VIS_LIDAR_X3_THREE</span></div>
            <div class="hud-text">HOSTILITY: <span id="hostility-val">0.00</span></div>
            
            <!-- Control Panel -->
            <div id="controls">
                <label for="videoSource">INPUT SOURCE (CAMERA):</label>
                <select id="videoSource"></select>
                
                <label for="viewModeSelect">VIEW MODE (DISPLAY):</label>
                <select id="viewModeSelect">
                    <option value="standard">STANDARD (Monitor)</option>
                    <option value="vr_sbs">VR 180° (SBS 3D)</option>
                </select>

                <label for="colorMode">COLOR PALETTE (RENDER MODE):</label>
                <select id="colorMode">
                    <option value="default">AI_EYE DEFAULT (Blue/Red Hostility)</option>
                    <option value="depth">DEPTH MAP (Turbo Spectrum)</option> 
                    <option value="cyberpunk">AUTONOMOUS BLUE (Deep Blue/Cyan)</option>
                    <option value="heatmap">THERMAL HEATMAP (Discrete Bands)</option>
                    <option value="whitehot">RAW INTENSITY (Greyscale)</option>
                </select>
                
                <label for="thresholdSlider">NOISE GATE (Background Cutoff):</label>
                <input type="range" id="thresholdSlider" min="0" max="100" value="15">
                
                <label for="zScaleSlider">DEPTH EXAGGERATION (3D Pop):</label>
                <input type="range" id="zScaleSlider" min="50" max="800" value="400">
                
                <!-- VR-specific controls -->
                <div id="vrControls" style="display:none; border-top: 1px dashed #0ff; margin-top:5px; padding-top:5px;">
                     <label for="eyeSepSlider">STEREO SEPARATION (IPD):</label>
                     <input type="range" id="eyeSepSlider" min="0" max="20" value="6">
                </div>

                <button id="resetViewBtn" onclick="window.resetCameraView()">[⟲] RESET CAMERA VIEW</button>
                <button id="fullscreenBtn" onclick="window.toggleFullscreen()">[⛶] ENTER FULLSCREEN (VR MODE)</button>
                <button id="xrBtn" onclick="window.requestXRSession()">[VR] REQUEST XR PERMISSIONS</button>

                <!-- AI trigger button -->
                <button id="analyzeBtn" onclick="window.analyzeSector()">✨ ANALYZE SECTOR</button>
            </div>
        </div>
        
        <!-- AI analysis result display area -->
        <div id="analysis-log">
            <h3>> SECTOR_REPORT.LOG</h3>
            <div id="analysis-content">Waiting for query...</div>
        </div>
        
        <div style="position:absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center;">
            <div id="identity-msg" class="identity-locked">SUBJECT IDENTIFIED: HUMAN</div>
        </div>
        
        <div class="hud-bottom">
            <div class="hud-text">NEURAL_NET: <span id="model-status">INIT...</span></div>
            <div class="hud-text">POINTS_RENDERED: <span id="points-val">0</span></div>
            <div class="hud-text">FPS: <span id="fps-val">0</span></div>
        </div>
    </div>

    <!-- Native camera monitor area -->
    <div id="native-view">
        <video id="native-video" autoplay playsinline muted></video>
    </div>

    <!-- Hidden data sources -->
    <video id="video-source" style="display:none" autoplay playsinline></video>
    <canvas id="tempCanvas" style="display:none"></canvas>

    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <!-- Core Logic -->
    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Global Config & Gemini API ---
        const apiKey = ""; // Gemini API Key injected by environment

        // Resolution settings
        const resW = 260; 
        const resH = 180;
        const pointCount = resW * resH;

        // Three.js Objects
        let scene, camera, renderer, points, composer, bloomPass, controls;
        let video, nativeVideo, canvas, ctx;
        let geometry, positions, colors, sizes;
        
        // ML5 FaceMesh integrated with Three.js
        let faceMeshObj, faceGeo, facePos;
        let facemeshModel, faces = [];
        let modelLoaded = false;

        // State data
        let prevData = new Uint8Array(pointCount);
        let hostility = 0.0; 
        let currentStream = null;
        let activeXRSession = null;
        let isRequestingXR = false;
        
        // FPS calculation
        let frames = 0, lastTime = performance.now(), currentFps = 0;

        // --- Initialize Video Device Selection ---
        async function getVideoSources() {
            const select = document.getElementById('videoSource');
            if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
                startStream(); 
                return;
            }
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                select.innerHTML = '';
                devices.forEach(device => {
                    if (device.kind === 'videoinput') {
                        const option = document.createElement('option');
                        option.value = device.deviceId;
                        option.text = device.label || 'Camera ' + (select.length + 1);
                        select.appendChild(option);
                    }
                });
                select.onchange = startStream;
                startStream();
            } catch (e) {
                console.error("CAMERA_FAIL");
            }
        }

        async function startStream() {
            const deviceId = document.getElementById('videoSource').value;
            video = document.getElementById('video-source');
            nativeVideo = document.getElementById('native-video');

            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            let constraints = {
                video: {
                    deviceId: deviceId ? { exact: deviceId } : undefined,
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                }
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                nativeVideo.srcObject = currentStream;
                
                // Initialize ML5 Facial Recognition
                if (!modelLoaded && window.ml5) {
                    initFaceMesh();
                }
            } catch (e) { 
                console.error("Start Stream Failed:", e); 
            }
        }

        // --- Initialize ML5 Facial Recognition ---
        function initFaceMesh() {
            facemeshModel = window.ml5.facemesh(video, () => {
                modelLoaded = true;
                const statusEl = document.getElementById('model-status');
                statusEl.innerText = "ONLINE";
                statusEl.style.color = "#0ff";
            });
            facemeshModel.on('predict', results => {
                faces = results;
            });
        }

        // --- Generate Point Cloud Glow Texture ---
        function createTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const context = canvas.getContext('2d');
            const grad = context.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            context.fillStyle = grad;
            context.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        // --- Three.js Initialization ---
        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 50;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            // Place Three.js canvas below all UI layers
            renderer.domElement.style.position = 'absolute';
            renderer.domElement.style.top = '0';
            renderer.domElement.style.left = '0';
            renderer.domElement.style.zIndex = '1';
            document.body.appendChild(renderer.domElement);

            // OrbitControls for mouse drag interaction
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Post-processing: Bloom effect
            const renderScene = new RenderPass(scene, camera);
            bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.4, 0.85);
            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            // Canvas data reading
            canvas = document.getElementById('tempCanvas');
            canvas.width = resW; canvas.height = resH;
            ctx = canvas.getContext('2d', { willReadFrequently: true });

            // 1. Create main point cloud Geometry
            geometry = new THREE.BufferGeometry();
            positions = new Float32Array(pointCount * 3);
            colors = new Float32Array(pointCount * 3);
            sizes = new Float32Array(pointCount);

            for (let i = 0; i < pointCount; i++) {
                const ix = i % resW;
                const iy = Math.floor(i / resW);
                // Preset X and Y
                positions[i * 3] = (ix - resW / 2) * 0.38 + (Math.random()-0.5)*0.15;
                positions[i * 3 + 1] = (resH / 2 - iy) * 0.38 + (Math.random()-0.5)*0.15;
                positions[i * 3 + 2] = 0;
                sizes[i] = 1.0;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            // Add custom size attribute to hide points below threshold
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            // Main point cloud material (ShaderMaterial for individual point size control)
            const material = new THREE.ShaderMaterial({
                uniforms: {
                    color: { value: new THREE.Color(0xffffff) },
                    pointTexture: { value: createTexture() }
                },
                vertexShader: `
                    attribute float size;
                    varying vec3 vColor;
                    void main() {
                        vColor = color;
                        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                        gl_PointSize = size * (300.0 / -mvPosition.z);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    uniform sampler2D pointTexture;
                    varying vec3 vColor;
                    void main() {
                        gl_FragColor = vec4(vColor, 1.0) * texture2D(pointTexture, gl_PointCoord);
                    }
                `,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true,
                vertexColors: true
            });

            points = new THREE.Points(geometry, material);
            scene.add(points);

            // 2. Create facial recognition green points Mesh
            faceGeo = new THREE.BufferGeometry();
            const maxFacePoints = 468;
            facePos = new Float32Array(maxFacePoints * 3);
            faceGeo.setAttribute('position', new THREE.BufferAttribute(facePos, 3));
            const faceMat = new THREE.PointsMaterial({ 
                color: 0x00ff00, 
                size: 1.5, 
                transparent: true, 
                opacity: 0.9,
                depthTest: false
            });
            faceMeshObj = new THREE.Points(faceGeo, faceMat);
            faceMeshObj.visible = false;
            scene.add(faceMeshObj);

            // UI interaction listeners
            document.getElementById('viewModeSelect').addEventListener('change', (e) => {
                const vrControls = document.getElementById('vrControls');
                if (e.target.value === 'vr_sbs') {
                    vrControls.style.display = 'block';
                } else {
                    vrControls.style.display = 'none';
                    // Reset camera and renderer
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
                    renderer.setScissorTest(false);
                    scene.position.x = 0;
                }
            });

            window.addEventListener('resize', onWindowResize);
            
            getVideoSources();
            animate();
        }

        // --- Get color for specific mode ---
        function getBaseColor(mode, normB) {
            let r=0, g=0, b=0;
            if (mode === 'depth') {
                if (normB < 0.15) { b = normB / 0.15; }
                else if (normB < 0.35) { let lt = (normB - 0.15)/0.2; g = lt; b = 1; }
                else if (normB < 0.6) { let lt = (normB - 0.35)/0.25; r = lt; g = 1; b = 1 - lt*0.5; }
                else { let lt = (normB - 0.6)/0.4; r = 1; g = 1 - lt; b = 0; }
            } else if (mode === 'cyberpunk') {
                let val = normB * 255;
                if (val > 220) { r=1; g=1; b=1; }
                else if (val > 150) { r=0; g=1; b=1; }
                else if (val > 80) { r=0; g=0.39; b=0.78; }
                else { r=0; g=0.08; b=0.39; }
            } else if (mode === 'heatmap') {
                if (normB > 0.8) { r=1; g=0.2; b=0.2; }
                else if (normB > 0.6) { r=1; g=0.8; b=0; }
                else if (normB > 0.4) { r=1; g=1; b=0; }
                else if (normB > 0.2) { r=0; g=1; b=0; }
                else { r=0; g=0; b=1; }
            } else if (mode === 'whitehot') {
                r = normB; g = normB; b = normB;
            } else { // default
                r = normB * 0.1;
                g = normB * 0.8;
                b = normB * 1.5;
            }
            return {r, g, b};
        }

        // --- Main Render Loop ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            // 1. Process point cloud data and visual effects
            if (video && video.readyState === video.HAVE_ENOUGH_DATA) {
                ctx.drawImage(video, 0, 0, resW, resH);
                const imageData = ctx.getImageData(0, 0, resW, resH).data;
                
                const posAttr = geometry.attributes.position;
                const colAttr = geometry.attributes.color;
                const sizeAttr = geometry.attributes.size;

                const threshold = parseInt(document.getElementById('thresholdSlider').value);
                const zScale = parseInt(document.getElementById('zScaleSlider').value) / 400;
                const cMode = document.getElementById('colorMode').value;

                let motionCounter = 0;
                let activePoints = 0;

                for (let i = 0; i < pointCount; i++) {
                    const x = i % resW;
                    const y = Math.floor(i / resW);
                    const idx = (y * resW + (resW - 1 - x)) * 4; // Mirrored reading

                    const bright = (imageData[idx] + imageData[idx+1] + imageData[idx+2]) / 3;
                    
                    // Motion detection: brightness difference between current and previous frame
                    if (Math.abs(bright - prevData[i]) > 40) motionCounter++;
                    prevData[i] = bright;

                    const normB = bright / 255;
                    
                    if (bright > threshold) {
                        activePoints++;
                        // Dynamic Z-depth calculation
                        const targetZ = (Math.pow(normB, 2.2) * 38 - 8) * zScale;
                        const jitter = (Math.random() - 0.5) * hostility * 4.5;
                        posAttr.array[i * 3 + 2] = THREE.MathUtils.lerp(posAttr.array[i * 3 + 2], targetZ + jitter, 0.2);
                        
                        sizeAttr.array[i] = 1.0; // Restore display size

                        // Mix user color selection with hostility state (blazing red)
                        let baseC = getBaseColor(cMode, normB);
                        colAttr.array[i * 3] = THREE.MathUtils.lerp(baseC.r, normB * 2.0, hostility); 
                        colAttr.array[i * 3 + 1] = THREE.MathUtils.lerp(baseC.g, 0, hostility);
                        colAttr.array[i * 3 + 2] = THREE.MathUtils.lerp(baseC.b, 0, hostility);
                    } else {
                        // Hide points below threshold
                        sizeAttr.array[i] = 0.0;
                    }
                }

                // Smooth transition for hostility index
                if (motionCounter > pointCount * 0.012) {
                    hostility = THREE.MathUtils.lerp(hostility, 1.0, 0.15);
                } else {
                    hostility = THREE.MathUtils.lerp(hostility, 0.0, 0.03);
                }
                
                // Update DOM text only, avoid frequent operations
                if(frames % 10 === 0) {
                    document.getElementById('hostility-val').innerText = hostility.toFixed(2);
                    document.getElementById('points-val').innerText = activePoints;
                }

                updateVisualStates(hostility);
                
                posAttr.needsUpdate = true;
                colAttr.needsUpdate = true;
                sizeAttr.needsUpdate = true;

                // 2. Update facial tracking Mesh
                if (modelLoaded && faces.length > 0) {
                    document.getElementById('identity-msg').style.display = 'block';
                    const kps = faces[0].scaledMesh;
                    for (let j = 0; j < kps.length; j++) {
                        const [fx, fy, fz] = kps[j];
                        // Coordinate mapping: map ml5 result (640x480) to Three.js space (resW/resH)
                        const mappedX = ((640 - fx) / 640 * resW - resW / 2) * 0.38;
                        const mappedY = (resH / 2 - fy / 480 * resH) * 0.38;
                        const mappedZ = (-fz * 0.1) + zScale * 5.0 + 2.0; // Slight offset in front of the face
                        
                        facePos[j*3] = mappedX;
                        facePos[j*3+1] = mappedY;
                        facePos[j*3+2] = mappedZ;
                    }
                    faceGeo.attributes.position.needsUpdate = true;
                    faceMeshObj.visible = true;
                } else {
                    document.getElementById('identity-msg').style.display = 'none';
                    faceMeshObj.visible = false;
                }
            }

            // Calculate FPS
            frames++;
            const now = performance.now();
            if (now - lastTime >= 1000) {
                currentFps = Math.round((frames * 1000) / (now - lastTime));
                document.getElementById('fps-val').innerText = currentFps;
                frames = 0;
                lastTime = now;
            }

            // 3. Execute rendering (based on view mode)
            const viewMode = document.getElementById('viewModeSelect').value;
            
            if (viewMode === 'vr_sbs') {
                // VR Split-screen mode: Manually split left and right
                renderer.setScissorTest(true);
                const halfWidth = window.innerWidth / 2;
                const eyeSep = parseInt(document.getElementById('eyeSepSlider').value) * 0.1;
                
                camera.aspect = halfWidth / window.innerHeight;
                camera.updateProjectionMatrix();

                // Render left eye
                renderer.setViewport(0, 0, halfWidth, window.innerHeight);
                renderer.setScissor(0, 0, halfWidth, window.innerHeight);
                scene.position.x = eyeSep; // Create parallax
                renderer.render(scene, camera);

                // Render right eye
                renderer.setViewport(halfWidth, 0, halfWidth, window.innerHeight);
                renderer.setScissor(halfWidth, 0, halfWidth, window.innerHeight);
                scene.position.x = -eyeSep;
                renderer.render(scene, camera);

                scene.position.x = 0; // Restore
            } else {
                // Standard mode, with bloom effect
                composer.render();
            }
        }

        function updateVisualStates(h) {
            bloomPass.strength = 1.2 + h * 3.8;
            if (h > 0.4) {
                document.body.classList.add('hostile');
                camera.position.x = (Math.random() - 0.5) * h * 1.5;
                camera.position.y = (Math.random() - 0.5) * h * 1.5;
            } else {
                document.body.classList.remove('hostile');
                camera.position.x = THREE.MathUtils.lerp(camera.position.x, 0, 0.1);
                camera.position.y = THREE.MathUtils.lerp(camera.position.y, 0, 0.1);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Global Interaction Functions (Exposed to window for HTML buttons) ---

        window.toggleFullscreen = function() {
            let fs = document.fullscreenElement || document.webkitFullscreenElement;
            if (!fs) {
                let elem = document.documentElement;
                let request = elem.requestFullscreen || elem.webkitRequestFullscreen;
                if(request) request.call(elem).catch(err => alert("Fullscreen error"));
            } else {
                let exit = document.exitFullscreen || document.webkitExitFullscreen;
                if(exit) exit.call(document);
            }
        };

        window.resetCameraView = function() {
            if (camera && controls) {
                // Reset camera to initial coordinates
                camera.position.set(0, 0, 50);
                camera.rotation.set(0, 0, 0);
                // Reset OrbitControls center target
                controls.target.set(0, 0, 0);
                controls.update();
            }
        };

        // Capture current canvas frame and send to Gemini API for analysis
        window.analyzeSector = async function() {
            if (!video || video.readyState !== video.HAVE_ENOUGH_DATA) return;

            const btn = document.getElementById('analyzeBtn');
            const logPanel = document.getElementById('analysis-log');
            const content = document.getElementById('analysis-content');
            
            btn.disabled = true;
            btn.innerText = "CALCULATING...";
            logPanel.style.display = 'block';
            content.innerHTML = "<span class='loading-pulse'>[SCANNING NEURAL PATHWAYS...]</span>";
            content.className = "loading-pulse";

            try {
                // Create high-res screenshot canvas for Gemini recognition
                const highResCanvas = document.createElement('canvas');
                highResCanvas.width = 640;
                highResCanvas.height = 480;
                const highCtx = highResCanvas.getContext('2d');
                highCtx.drawImage(video, 0, 0, 640, 480);
                const base64Image = highResCanvas.toDataURL('image/jpeg', 0.8).split(',')[1]; 

                const prompt = `
                Role: You are an autonomous Machine Vision System (Model: LIDAR-X3).
                Task: Analyze this visual input and generate a tactical scan report.
                Style: Cold, robotic, analytical, sci-fi (like The Terminator or HAL 9000). Use technical jargon. Please respond in English.
                Format:
                - **[DETECTED ENTITIES]**: List main objects/people.
                - **[COMPOSITION]**: Guess materials (Carbon-based, Polymer, Alloy).
                - **[ANOMALY ANALYSIS]**: A brief, cryptic sentence about the 'nature' of what you see.
                - **[THREAT LEVEL]**: LOW / MEDIUM / CRITICAL.
                
                Keep the response short (under 100 words).
                `;

                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: prompt },
                                    { inlineData: { mimeType: "image/jpeg", data: base64Image } }
                                ]
                            }]
                        })
                    }
                );

                if (!response.ok) throw new Error(`API Error: ${response.status}`);
                const data = await response.json();
                const text = data.candidates[0].content.parts[0].text;

                content.className = ""; 
                content.innerHTML = marked.parse(text); 

            } catch (error) {
                console.error(error);
                content.className = "";
                content.innerHTML = `<span style="color:red">ERROR: UPLINK FAILED (${error.message})</span>`;
            } finally {
                btn.disabled = false;
                btn.innerText = "✨ ANALYZE SECTOR";
            }
        };

        window.requestXRSession = async function() {
            if (isRequestingXR) return;
            const btn = document.getElementById('xrBtn');
            const originalText = btn.innerText;

            try {
                isRequestingXR = true;
                btn.disabled = true;
                btn.innerText = "PROCESSING...";
                
                if (activeXRSession) {
                    await activeXRSession.end();
                    activeXRSession = null;
                    return; 
                }
        
                if (!navigator.xr) {
                    alert("WebXR is not supported. Use Standard Mode instead.");
                    return;
                }
                
                const isSupported = await navigator.xr.isSessionSupported('immersive-vr');
                if (!isSupported) {
                    alert("Immersive VR not supported on this device.");
                    return;
                }
                
                const session = await navigator.xr.requestSession('immersive-vr', {
                    optionalFeatures: ['hand-tracking', 'local-floor']
                });
                
                activeXRSession = session;
                
                session.addEventListener('end', () => {
                    activeXRSession = null;
                });
                
                function onXRFrame(t, frame) {
                    if(!activeXRSession) return;
                    session.requestAnimationFrame(onXRFrame);
                }
                session.requestAnimationFrame(onXRFrame);
                
                alert("✅ WebXR Session Granted!\n\nVR Mode is now ACTIVE.\n\nNOTE: You may see a black screen in Immersive Mode if the camera is blocked. Quit Immersive and use 'VR 180 (SBS)' mode + Fullscreen for the optimal trick.");
                
            } catch (err) {
                console.error(err);
                alert("XR Permission Denied or Error: " + err.message);
            } finally {
                isRequestingXR = false;
                btn.disabled = false;
                btn.innerText = originalText;
            }
        };

        // Start system
        init();
    </script>
</body>
</html>
